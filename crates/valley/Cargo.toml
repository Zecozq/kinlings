[package]
name = "kinlings-valley"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The Kinlings valley: every item in one NEP-245 contract, plus the rules of the game."

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Lets the owner start the valley over while it is being tested. The contract
# the public plays is built without this.
dev-reset = []

[dependencies]
near-sdk = "5.30.1"
kinlings-core = { path = "../core" }

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }

[package.metadata.near.wasm-opt]
enabled = true
