<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kinlings food icons</title>
    <style>
      html, body { margin: 0; background: #fff6e3; color: #3b2a1e; font-family: system-ui, sans-serif; }
      #grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; padding: 14px; }
      .cell { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 13px; }
      .row { display: flex; gap: 10px; align-items: center; padding: 6px 14px; flex-wrap: wrap; }
      .chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 12px; background: #f6e7c8; }
      .dark { background: #3b2a1e; }
      #info { position: fixed; right: 10px; bottom: 6px; font-size: 12px; opacity: 0.7; }
    </style>
  </head>
  <body>
    <div id="grid"></div>
    <div id="small"></div>
    <div id="info"></div>
    <script type="module" src="/src/three/food-test.ts"></script>
  </body>
</html>
